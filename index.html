<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Modeboard — Find your next look</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Modeboard home"><span class="brand-mark">m</span><span class="brand-name">modeboard</span></a>
    <div class="search-wrap">
      <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="search" class="search" type="search" placeholder="Search outfits, moods, pieces..." autocomplete="off" aria-label="Search fashion inspiration">
      <div id="suggestions" class="suggestions" role="listbox"></div>
    </div>
    <nav class="nav-links" aria-label="Main navigation">
      <a class="nav-link active" href="#home">Home</a><a class="nav-link" href="#explore">Explore</a>
      <button class="nav-link" data-action="create">Create</button><button class="nav-link mobile-visible" aria-label="Notifications" data-action="notifications"><span class="notification-label">Notifications</span><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg></button><a class="nav-link profile-label" href="#profile">Profile</a>
      <a href="#profile" aria-label="Profile"><img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=96&q=80" alt=""></a>
    </nav>
  </header>
  <div class="categories" id="categories" aria-label="Filter by fashion category"></div>
  <main id="home">
    <section class="section-heading"><div><p class="eyebrow">The moodboard edit</p><h1 id="heading">Ideas for your next look</h1></div><span class="result-count" id="result-count"></span></section>
    <section class="masonry" id="masonry" aria-label="Fashion inspiration"></section>
    <div class="empty-state" id="empty-state"><strong>No looks found just yet.</strong>Try another search or category.</div>
  </main>
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-label="Fashion pin details">
    <article class="detail-modal">
      <div class="detail-visual"><img id="detail-image" src="" alt=""></div>
      <div class="detail-content">
        <div class="detail-top"><div class="detail-actions"><button class="icon-button" id="detail-like" aria-label="Like this look"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path></svg></button><button class="save-button saved" id="detail-save">Save</button></div><button class="close-modal" id="close-modal" aria-label="Close details">&times;</button></div>
        <h2 class="detail-title" id="detail-title"></h2><p class="detail-description" id="detail-description"></p>
        <div class="profile-row"><img id="detail-avatar" src="" alt=""><div><div class="profile-name" id="detail-creator"></div><div class="profile-sub">Style contributor</div></div></div>
        <div class="detail-divider"></div><h3 class="detail-label">The details</h3><div class="tag-list" id="detail-tags"></div>
        <div class="detail-divider"></div><h3 class="detail-label">Shop the look</h3><a class="product-link" href="#shop" data-action="shop"><span>Explore similar pieces</span><span>View edit ↗</span></a>
        <div class="detail-divider"></div><h3 class="detail-label">Notes from the community</h3><div class="comment-list" id="comment-list"><span>Love the proportions on this one.</span></div>
        <form class="comment-form" id="comment-form"><input id="comment-input" placeholder="Add a thoughtful note..." aria-label="Add a comment"><button type="submit">Post</button></form>
        <div class="detail-divider"></div><h3 class="detail-label">Related looks</h3><div class="related-row" id="related-row"></div>
      </div>
    </article>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js" defer></script>
</body>
</html>
